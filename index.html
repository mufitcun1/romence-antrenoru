<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoTrainer</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoTrainer">
<!-- Google AdSense: site sahipliği doğrulaması + reklam gösterimi için gerekli.
     pub- kimliği hesabın herkese açık yayıncı kimliğidir, gizli bir bilgi değildir. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8839017193363783" crossorigin="anonymous"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="wrap">
  <h1>🇷🇴 RoTrainer</h1>
  <p class="sub">Kelime · Fiil Çekimi · Gramer — tekrarla, ustalaş, sınava gir</p>

  <div class="userbar" id="userbar">
    <span class="who" id="userbarWho"></span>
    <span class="syncbadge" id="syncBadge" title="Bulut yedeği"></span>
    <button type="button" id="logoutBtn">Çıkış Yap</button>
  </div>

  <div class="gamebar" id="gamebar" style="display:none">
    <div class="gstreak">
      <span class="gflame" id="gFlame">&#128293;</span>
      <span class="gval" id="gStreakNum">0</span>
      <span class="glbl">günlük seri</span>
    </div>
    <div class="gxp">
      <div class="gxptop"><span class="gval" id="gXpNum">0/40</span><span class="glbl">bugünkü XP</span></div>
      <div class="barwrap"><div class="bar" id="gXpBar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Tema/ses satırı mobilde ana eylemi (Pratiğe Başla) katlamanın altına
       itiyordu; dar ekranda tek bir düğmeye katlanıyor. -->
  <button type="button" class="palettetoggle" id="paletteToggle" aria-expanded="false" aria-controls="paletteRow" title="Tema ve ses">&#127912;</button>
  <div class="palettepicker" id="paletteRow">
    <span class="lbl">Tema:</span>
    <button type="button" class="paletteswatch" data-palette="blue" style="background:#2563eb" title="Mavi" aria-label="Mavi tema"></button>
    <button type="button" class="paletteswatch" data-palette="green" style="background:#0e7490" title="Yeşil" aria-label="Yeşil tema"></button>
    <button type="button" class="paletteswatch" data-palette="purple" style="background:#7c3aed" title="Mor" aria-label="Mor tema"></button>
    <button type="button" class="sfxbtn" id="sfxToggle" aria-pressed="true" title="Ses ve titreşim">🔊</button>
  </div>

  <div class="levelrow" id="levelrow" style="display:none">
    <button class="levelchip active" data-level="A1">A1</button>
    <button class="levelchip" data-level="A2">A2</button>
    <button class="levelchip" data-level="B1">B1</button>
  </div>

  <!-- Sekmeler <div> idi: klavyeyle odaklanılamıyor, ekran okuyucu sekme
       olduklarını bilmiyordu (Play Console ön yayın raporu bunu işaretler). -->
  <div class="tabs" id="tabsRow" role="tablist" style="display:none">
    <div class="tab" role="tab" tabindex="0" aria-selected="false" data-tab="practice">Pratik</div>
    <div class="tab" role="tab" tabindex="0" aria-selected="false" data-tab="test">Deneme Sınavı</div>
    <div class="tab" role="tab" tabindex="0" aria-selected="false" data-tab="dash">İlerleme</div>
  </div>

  <div id="app-root"></div>

  <div class="footerlinks"><a href="gizlilik-politikasi.html">Gizlilik Politikası</a></div>
</div>

<div class="savepill" id="savepill">Kaydedildi ✓</div>

<!-- Bağımlılık sırasına göre yükleniyor: veri -> yardımcılar -> depolama ->
     hesaplar -> ses -> alıştırma üreticileri -> arayüz (INIT en sonda çalışır) -->
<script src="js/data.js"></script>
<script src="js/data-a2.js"></script>
<script src="js/data-b1.js"></script>
<script src="js/sentence-gen.js"></script>
<script src="js/helpers.js"></script>
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/accounts.js"></script>
<script src="js/gamify.js"></script>
<script src="js/sync.js"></script>
<script src="js/feedback.js"></script>
<script src="js/audio.js"></script>
<script src="js/icons.js"></script>
<script src="js/exercises.js"></script>
<script src="js/ui.js"></script>
<script>
/* Uygulamayı "Ana ekrana ekle" ile yüklenebilir/çevrimdışı çalışır yapan
   service worker kaydı. Yeni bir sürüm devreye girdiğinde (controllerchange)
   sayfayı yeniliyoruz ki kullanıcı elle yenilemek zorunda kalmasın.

   AMA TUR ORTASINDA DEĞİL: eskiden yenileme koşulsuzdu ve her yayında, o an
   soru çözen herkesin turu sessizce siliniyor, seviye seçimi sıfırlanıyordu
   (kalite kontrol turunda 8/10. soruda bizzat yaşandı). Artık tur/sınav
   sürüyorsa yenileme erteleniyor; kullanıcıya küçük bir şerit gösteriliyor,
   isterse hemen yükleyebiliyor, istemezse tur biter bitmez kendiliğinden
   yükleniyor. "refreshing" bayrağı sonsuz döngüyü engelliyor. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
  let refreshing = false;

  const turDevamEdiyor = () => {
    try { return typeof turDevamEdiyorMu === "function" && turDevamEdiyorMu(); }
    catch (e) { return false; }   // ui.js henüz yüklenmediyse ertelemeye gerek yok
  };
  const yenile = () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  };
  const seritGoster = () => {
    if (document.getElementById("updateBar")) return;
    const d = document.createElement("div");
    d.id = "updateBar";
    d.setAttribute("role", "status");
    d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:flex;gap:10px;" +
      "align-items:center;justify-content:space-between;max-width:520px;margin:0 auto;padding:10px 14px;" +
      "border-radius:12px;background:#1f2937;color:#fff;font-size:.82rem;box-shadow:0 6px 20px rgba(0,0,0,.25)";
    d.innerHTML = '<span>Yeni sürüm hazır — turun bitince yüklenecek.</span>' +
      '<button type="button" id="updateNowBtn" style="flex:none;border:0;border-radius:8px;padding:6px 12px;' +
      'font-weight:600;cursor:pointer;background:#fff;color:#1f2937">Şimdi yükle</button>';
    document.body.appendChild(d);
    document.getElementById("updateNowBtn").addEventListener("click", yenile);
  };

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return;
    if (!turDevamEdiyor()) { yenile(); return; }
    seritGoster();
    const izle = setInterval(() => {
      if (!turDevamEdiyor()) { clearInterval(izle); yenile(); }
    }, 2000);
  });
}
</script>
</body>
</html>
